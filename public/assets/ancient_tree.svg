<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4E342E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Roots -->
  <path d="M40 110 Q 30 128 10 128" stroke="#3E2723" stroke-width="6" fill="none"/>
  <path d="M88 110 Q 98 128 118 128" stroke="#3E2723" stroke-width="6" fill="none"/>
  <path d="M64 110 L 64 128" stroke="#3E2723" stroke-width="8" fill="none"/>

  <!-- Trunk -->
  <path d="M40 110 L 30 60 L 98 60 L 88 110 Z" fill="url(#trunk)"/>
  
  <!-- Face -->
  <path d="M50 80 Q 55 75 60 80" stroke="#8D6E63" stroke-width="2" fill="none"/>
  <path d="M68 80 Q 73 75 78 80" stroke="#8D6E63" stroke-width="2" fill="none"/>
  <path d="M58 95 Q 64 100 70 95" stroke="#8D6E63" stroke-width="2" fill="none"/>
  
  <!-- Glowing Runes -->
  <path d="M64 70 L 64 90" stroke="#00E676" stroke-width="2" opacity="0.6"/>
  <circle cx="64" cy="80" r="15" stroke="#00E676" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Foliage -->
  <circle cx="64" cy="40" r="35" fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>
  <circle cx="30" cy="50" r="20" fill="#388E3C" stroke="#1B5E20" stroke-width="3"/>
  <circle cx="98" cy="50" r="20" fill="#388E3C" stroke="#1B5E20" stroke-width="3"/>
  <circle cx="64" cy="20" r="15" fill="#43A047" stroke="#1B5E20" stroke-width="3"/>
  
  <!-- Magic Orbs -->
  <circle cx="20" cy="40" r="4" fill="#69F0AE">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="108" cy="40" r="4" fill="#69F0AE">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
